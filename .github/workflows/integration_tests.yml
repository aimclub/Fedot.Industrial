name: Integration Tests

on:
  schedule:
    - cron: '0 12 1,15 * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential git
      - name: Install resolver
        run: python -m pip install "uv==0.8.17"
      - name: Resolve dependencies
        run: uv lock --python 3.10
      - name: Export resolved dependencies
        run: uv export --frozen --extra dev --no-hashes --no-emit-project --output-file /tmp/industrial-requirements.txt
      - name: Install CPU runtime
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1" "torchvision==0.20.1"
      - name: Install resolved dependencies and project
        run: |
          python -m pip install -r /tmp/industrial-requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m tools.platform_support check --json
      - name: Run integration tests
        run: python -m pytest --cov=fedot_ind tests/integration -vv --cov-report=xml
      - name: Codecov coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: integrationtests
