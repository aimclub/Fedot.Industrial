name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install resolver
        run: python -m pip install "uv==0.8.17"
      - name: Export frozen dependencies
        run: uv export --frozen --extra fedot-legacy --extra dev --no-hashes --no-emit-project --output-file /tmp/industrial-requirements.txt
      - name: Install CPU runtime
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1" "torchvision==0.20.1"
      - name: Install locked dependencies and project
        run: |
          python -m pip install -r /tmp/industrial-requirements.txt
          python -m pip install --no-deps -e .
          python -m pip check
          python -m tools.platform_support check --json
          python -m tools.platform_support environment --profile legacy --json
      - name: Run tests with pytest
        run: python -m pytest --cov=fedot_ind --cov-report xml:coverage.xml tests/unit -vv
      - name: Codecov coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
