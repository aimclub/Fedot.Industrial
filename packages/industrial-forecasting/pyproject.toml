[project]
name = "industrial-forecasting"
version = "0.1.0"
description = "Time series forecasting contracts and models independent of FEDOT"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
requires-python = ">=3.10,<3.12"
dependencies = ["numpy>=1.24.4,<2"]

[project.optional-dependencies]
neural = ["industrial-neural==0.1.0"]

[project.urls]
Source = "https://github.com/aimclub/Fedot.Industrial"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["industrial_forecasting", "industrial_forecasting.*"]

[tool.uv.sources]
industrial-neural = {workspace = true}

[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"
