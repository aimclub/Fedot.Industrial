[project]
name = "fedot-ind"
version = "0.5.0"
description = "Time series analysis framework"
authors = [{name = "NSS Lab", email = "itmo.nss.team@gmail.com"}]
license = "BSD-3-Clause"
license-files = ["LICENSE.md"]
readme = "README_en.rst"
requires-python = ">=3.10,<3.12"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["automated machine learning", "time series", "anomaly detection"]
dependencies = [
    "fedot @ git+https://github.com/aimclub/FEDOT.git@42f3ba490407a1106e898e94232f2afd0a78f73f",
    "typing==3.7.4.3",
    "numpy>=1.24.4,<2",
    "scipy>=1.10,<1.15.2",
    "pandas>=2,<2.3",
    "scikit-learn==1.3.2",
    "sktime>=0.26,<0.31",
    "dask[array,dataframe]==2024.4.2",
    "distributed==2024.4.2",
    "dask-ml==2024.4.4",
    "spacy>=3.5,<3.6",
    "torch>=2.2,<2.6",
    "torchvision>=0.17,<0.21",
    "fastai==2.7.18",
    "giotto-tda==0.6.2",
    "scikit-tda>=1.1.1,<2",
    "chardet>=5.2,<6",
    "tensorly>=0.9,<0.10",
    "pymonad>=2.4,<3",
    "setuptools>=70,<81",
    "pywavelets>=1.5,<1.9",
    "mklpy>=0.6,<0.7",
    "librosa>=0.10.2.post1,<0.11",
    "pyriemann==0.7",
    "datasetsforecast>=0.0.8,<0.1",
    "datasets>=2.21,<3",
    "pyarrow>=15,<21",
    "spectrum>=0.8.1,<0.9",
    "optuna-integration>=4.1,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "pytest-cov>=6,<7",
    "build>=1,<2",
    "packaging>=24,<26",
    "tomli>=2,<3; python_version < '3.11'",
    "PyYAML>=6,<7",
    "uv==0.8.17",
]
notebooks = [
    "jupyter>=1,<2",
    "nbconvert>=7,<8",
    "ipykernel>=6,<7",
]

[project.urls]
Homepage = "https://github.com/aimclub/Fedot.Industrial"
Documentation = "https://github.com/aimclub/Fedot.Industrial/wiki"
Issues = "https://github.com/aimclub/Fedot.Industrial/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["fedot_ind", "fedot_ind.*"]
namespaces = true

[tool.setuptools.package-data]
fedot_ind = [
    "core/repository/data/*.json",
    "core/repository/data/ts_benchmark_metadata.csv",
    "core/architecture/postprocessing/ucr_datasets.json",
]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if __debug__:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "except Exception",
    "if verbose:",
    "if self.verbose:",
    "if self.print_training_progress:",
    "class ApiTemplate"
]

[build-system]
requires = ["setuptools>=77,<81", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"
